<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>站点积分台</title><link rel="stylesheet" href="/style.css"></head><body>
<main><header><div><p class="eyebrow">SITE POINTS HUB</p><h1>站点积分台</h1><p>余额、签到和运行状态，一处看清。</p></div><button id="logout" class="ghost hidden">退出</button></header>
<section id="login" class="panel login"><h2>管理员登录</h2><form id="loginForm"><input name="password" type="password" placeholder="管理密码" required><button>进入控制台</button></form><p id="loginError" class="error"></p></section>
<div id="app" class="hidden"><section class="stats"><article><span>站点</span><strong id="siteCount">0</strong></article><article><span>正常</span><strong id="okCount">0</strong></article><article><span>待处理</span><strong id="errorCount">0</strong></article></section>
<div class="actions"><button id="pollAll">刷新全部余额</button><button id="checkinAll" class="secondary">全部签到</button><button id="add" class="ghost">＋ 添加站点</button></div><section id="cards" class="cards"></section>
<section class="panel"><h2>最近运行</h2><div id="runs" class="runs"></div></section></div></main>
<dialog id="editor"><form id="accountForm"><h2>添加站点</h2><input name="id" type="hidden"><label>显示名称<input name="name" required placeholder="例如：我的站点"></label><label>站点地址<input name="baseUrl" type="url" required placeholder="https://example.com"></label><div class="grid"><label>余额接口<input name="balancePath" required placeholder="/api/user"></label><label>余额字段<input name="balanceField" value="balance" placeholder="data.points"></label></div><div class="grid"><label>签到接口<input name="checkinPath" placeholder="/api/checkin"></label><label>请求方式<select name="checkinMethod"><option>POST</option><option>GET</option></select></label></div><div class="grid"><label>认证方式<select name="authType"><option value="bearer">Bearer Token</option><option value="cookie">Cookie</option><option value="header">自定义请求头</option></select></label><label>自定义头名称<input name="headerName" placeholder="x-api-key"></label></div><label>凭据<input name="credential" type="password" placeholder="留空则保留原凭据"></label><p class="hint">仅连接你拥有或获授权的站点；凭据会加密保存。</p><div class="dialog-actions"><button type="button" id="cancel" class="ghost">取消</button><button>保存</button></div></form></dialog><script src="/app.js"></script></body></html>
