<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff4f8">
  <title>站点积分台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header><div><p class="eyebrow">SITE POINTS HUB</p><h1>站点积分台</h1><p>余额、签到和运行状态，一处看清。</p></div><button id="logout" class="ghost hidden">退出</button></header>
  <section id="login" class="panel login"><h2>管理员登录</h2><form id="loginForm"><input name="password" type="password" placeholder="管理密码" required><button>进入控制台</button></form><p id="loginError" class="error"></p></section>
  <div id="app" class="hidden">
    <section class="stats"><article><span>站点</span><strong id="siteCount">0</strong></article><article><span>正常</span><strong id="okCount">0</strong></article><article><span>待处理</span><strong id="errorCount">0</strong></article></section>
    <div class="actions"><button id="pollAll">刷新全部余额</button><button id="checkinAll" class="secondary">全部签到</button><button id="add" class="ghost">＋ 添加站点</button></div>
    <section id="cards" class="cards"></section>
    <section class="panel"><h2>最近运行</h2><div id="runs" class="runs"></div></section>
  </div>
</main>
<dialog id="editor">
  <form id="accountForm">
    <h2>添加站点</h2><input name="id" type="hidden">
    <div class="grid">
      <label>面板类型<select name="panelType" id="panelType"><option value="auto">自动识别（推荐）</option><option value="newapi">New API / One API</option><option value="generic">自定义 JSON API</option></select></label>
      <label>余额币种<select name="currency"><option value="auto">跟随站点（推荐）</option><option value="cny">人民币 ¥</option><option value="usd">美元 $</option><option value="raw">原始积分</option></select></label>
    </div>
    <label>显示名称<input name="name" required placeholder="例如：星期五"></label>
    <label>站点地址<input name="baseUrl" type="url" required placeholder="https://api.example.com"></label>
    <div id="simpleFields"><div class="grid"><label>用户 ID<input name="userId" placeholder="个人中心显示的数字 ID"></label><label>登录 Cookie<input name="credential" class="credential" type="password" placeholder="留空则保留原 Cookie"></label></div><p class="hint">自动使用 Cookie + New-Api-User 请求头，并读取站点货币设置。</p></div>
    <div id="advancedFields" class="hidden">
      <div class="grid"><label>余额接口<input name="balancePath" placeholder="/api/user"></label><label>余额字段<input name="balanceField" value="balance" placeholder="data.points"></label></div>
      <div class="grid"><label>余额除数<input name="balanceDivisor" value="1" inputmode="decimal"></label><label>签到接口<input name="checkinPath" placeholder="/api/checkin"></label></div>
      <div class="grid"><label>请求方式<select name="checkinMethod"><option>POST</option><option>GET</option></select></label><label>认证方式<select name="authType"><option value="bearer">Bearer Token</option><option value="cookie">Cookie</option><option value="header">自定义请求头</option></select></label></div>
      <div class="grid"><label>自定义头名称<input name="headerName" placeholder="x-api-key"></label><label>凭据<input name="genericCredential" class="credential" type="password" placeholder="留空则保留原凭据"></label></div>
    </div>
    <h2 class="form-section">模型价格</h2>
    <div class="grid"><label>API Key<input name="apiKey" type="password" placeholder="sk-…，留空则保留原 Key"></label><label>模型名称<input name="modelName" placeholder="例如 gpt-4o-mini"></label></div>
    <p class="hint">按次模型显示每次价格；按量模型显示每百万输入和输出 Token 价格。API Key 会加密保存。</p>
    <p class="hint">仅连接你拥有或获授权的站点；凭据会加密保存。</p>
    <div class="dialog-actions"><button type="button" id="cancel" class="ghost">取消</button><button>保存</button></div>
  </form>
</dialog>
<script src="/app.js"></script>
</body>
</html>
